[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itl-attestation-cli"
version = "0.1.0"
description = "Command-line interface for ITL Control Plane Machine Attestation platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ITLusions", email = "info@itlusions.com"}
]
maintainers = [
    {name = "ITLusions", email = "info@itlusions.com"}
]
keywords = ["attestation", "cli", "tpm", "security", "control-plane", "itl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Environment :: Console",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-click",
]

[project.scripts]
attestation = "cli.__main__:cli"

[project.urls]
Homepage = "https://github.com/ITLusions/ITL.ControlPlane.Attestation"
Documentation = "https://github.com/ITLusions/ITL.ControlPlane.Attestation/blob/main/src/cli/README.md"
Repository = "https://github.com/ITLusions/ITL.ControlPlane.Attestation"
Issues = "https://github.com/ITLusions/ITL.ControlPlane.Attestation/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "RUF", # ruff-specific
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports
"tests/*" = ["ANN"]       # No annotations required in tests

[tool.ruff.lint.isort]
known-first-party = ["cli"]
