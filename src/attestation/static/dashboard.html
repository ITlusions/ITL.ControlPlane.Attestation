<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITL Attestation — Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            glass: 'rgba(255,255,255,0.05)',
          },
          backdropBlur: { xs: '2px' },
          fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: #04070f;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(56,189,248,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(99,102,241,0.07) 0%, transparent 60%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .glass-sm {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glass-hover:hover {
      background: rgba(255,255,255,0.07);
      transition: background 0.15s;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    .pulse-dot { animation: pulse-opacity 2s ease-in-out infinite; }
    @keyframes pulse-opacity { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    tr.selected td { background: rgba(56,189,248,0.06); }
    .action-btn {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      transition: all 0.15s;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .action-btn:hover { filter: brightness(1.2); }
    .action-btn:active { transform: scale(0.96); }
  </style>
</head>

<body class="text-slate-200 antialiased">

  <!-- Top nav -->
  <nav class="glass sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <!-- Shield icon -->
      <svg class="w-7 h-7 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
      <div>
        <div class="text-sm font-semibold text-white leading-tight">ITL Attestation</div>
        <div class="text-xs text-slate-500 leading-tight">Control Plane — Management</div>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <!-- Health indicator -->
      <div class="flex items-center gap-2">
        <span id="health-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="health-label" class="text-xs text-slate-500">—</span>
      </div>

      <!-- Auto-refresh toggle -->
      <label class="flex items-center gap-2 cursor-pointer select-none text-xs text-slate-400">
        <div class="relative">
          <input type="checkbox" id="auto-refresh" class="sr-only peer" checked />
          <div class="w-8 h-4 bg-slate-700 rounded-full peer-checked:bg-sky-600 transition-colors"></div>
          <div class="absolute top-0.5 left-0.5 w-3 h-3 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
        </div>
        Auto-refresh
      </label>

      <!-- Token input -->
      <div class="relative">
        <input id="admin-token" type="password" placeholder="Admin token"
          class="glass-sm text-xs text-slate-300 placeholder-slate-600 rounded-lg px-3 py-1.5 w-44 outline-none focus:border-sky-500/50 focus:ring-1 focus:ring-sky-500/30" />
      </div>

      <button onclick="loadMachines()" class="glass-sm text-xs text-sky-400 px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
        Refresh
      </button>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-8 space-y-6">

    <!-- Stats row -->
    <div id="stats-row" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
      <!-- filled by JS -->
    </div>

    <!-- Filter bar -->
    <div class="glass rounded-xl px-4 py-3 flex flex-wrap items-center gap-3">
      <div class="relative flex-1 min-w-48">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <input id="filter-search" type="text" placeholder="Search machine ID, serial, MAC, hostname…"
          oninput="renderTable()"
          class="w-full bg-transparent pl-8 pr-3 py-1.5 text-xs text-slate-300 placeholder-slate-600 outline-none" />
      </div>
      <div class="h-5 w-px bg-white/10"></div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="setFilter('all')" data-filter="all" class="filter-btn badge bg-white/10 text-slate-300 border border-white/10 hover:bg-white/20 cursor-pointer transition-all">All</button>
        <button onclick="setFilter('pending_approval')" data-filter="pending_approval" class="filter-btn badge bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 cursor-pointer transition-all">Pending</button>
        <button onclick="setFilter('registered')" data-filter="registered" class="filter-btn badge bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 cursor-pointer transition-all">Registered</button>
        <button onclick="setFilter('attested')" data-filter="attested" class="filter-btn badge bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 cursor-pointer transition-all">Attested</button>
        <button onclick="setFilter('locked')" data-filter="locked" class="filter-btn badge bg-orange-500/10 text-orange-400 border border-orange-500/20 hover:bg-orange-500/20 cursor-pointer transition-all">Locked</button>
        <button onclick="setFilter('revoked')" data-filter="revoked" class="filter-btn badge bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 cursor-pointer transition-all">Revoked</button>
      </div>
      <div class="ml-auto text-xs text-slate-500" id="machine-count">—</div>
    </div>

    <!-- Table -->
    <div class="glass rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead>
            <tr class="border-b border-white/5 text-slate-500 uppercase tracking-wider text-[0.65rem]">
              <th class="px-4 py-3 text-left">Machine</th>
              <th class="px-4 py-3 text-left">Hardware</th>
              <th class="px-4 py-3 text-left">Role</th>
              <th class="px-4 py-3 text-left">Status</th>
              <th class="px-4 py-3 text-left">EK Fingerprint</th>
              <th class="px-4 py-3 text-left">Registered</th>
              <th class="px-4 py-3 text-left">Attested</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="machine-tbody">
            <tr>
              <td colspan="8" class="px-4 py-16 text-center text-slate-600">
                <div class="flex flex-col items-center gap-3">
                  <svg class="w-8 h-8 text-slate-700" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
                  </svg>
                  Enter admin token and refresh to load machines
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Machine detail panel (slide-in) -->
  <div id="detail-overlay" onclick="closeDetail()" class="fixed inset-0 bg-black/50 z-40 hidden backdrop-blur-sm"></div>
  <aside id="detail-panel" class="fixed right-0 top-0 h-full w-[480px] z-50 translate-x-full transition-transform duration-300 glass border-l border-white/10 overflow-y-auto">
    <div class="p-6 space-y-6" id="detail-content"></div>
  </aside>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────────────────────────────────
    let machines = [];
    let activeFilter = 'all';
    let refreshTimer = null;

    // ─────────────────────────────────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────────────────────────────────
    const token = () => document.getElementById('admin-token').value.trim();

    function headers() {
      const t = token();
      return { 'Content-Type': 'application/json', ...(t ? { 'Authorization': `Bearer ${t}` } : {}) };
    }

    function toast(msg, type = 'info') {
      const colors = { info: 'bg-sky-500/20 border-sky-500/30 text-sky-300', success: 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300', error: 'bg-red-500/20 border-red-500/30 text-red-300' };
      const el = document.createElement('div');
      el.className = `pointer-events-auto glass-sm rounded-xl px-4 py-3 text-xs border fade-in ${colors[type]} max-w-xs`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function fmt(dt) {
      if (!dt) return '—';
      const d = new Date(dt);
      return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function trunc(s, n = 12) { return s ? s.slice(0, n) + '…' : '—'; }

    const STATUS_CFG = {
      pending_approval: { label: 'Pending',    bg: 'bg-amber-500/15',   text: 'text-amber-400',   dot: 'bg-amber-400' },
      registered:       { label: 'Registered', bg: 'bg-blue-500/15',    text: 'text-blue-400',    dot: 'bg-blue-400' },
      attested:         { label: 'Attested',   bg: 'bg-emerald-500/15', text: 'text-emerald-400', dot: 'bg-emerald-400' },
      rejected:         { label: 'Rejected',   bg: 'bg-red-500/15',     text: 'text-red-400',     dot: 'bg-red-400' },
      locked:           { label: 'Locked',     bg: 'bg-orange-500/15',  text: 'text-orange-400',  dot: 'bg-orange-400' },
      revoked:          { label: 'Revoked',    bg: 'bg-red-900/30',     text: 'text-red-500',     dot: 'bg-red-600' },
    };

    const ROLE_CFG = {
      controlplane: { label: 'Control Plane', bg: 'bg-violet-500/15', text: 'text-violet-400' },
      'worker-infra': { label: 'Worker Infra', bg: 'bg-cyan-500/15',  text: 'text-cyan-400' },
      'worker-app':   { label: 'Worker App',   bg: 'bg-sky-500/15',   text: 'text-sky-400' },
    };

    function statusBadge(s) {
      const c = STATUS_CFG[s] || { label: s, bg: 'bg-slate-500/15', text: 'text-slate-400', dot: 'bg-slate-400' };
      return `<span class="badge ${c.bg} ${c.text}"><span class="w-1.5 h-1.5 rounded-full ${c.dot} inline-block${s==='attested'?' pulse-dot':''}"></span>${c.label}</span>`;
    }

    function roleBadge(r) {
      const c = ROLE_CFG[r] || { label: r, bg: 'bg-slate-500/15', text: 'text-slate-400' };
      return `<span class="badge ${c.bg} ${c.text}">${c.label}</span>`;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Health check
    // ─────────────────────────────────────────────────────────────────────────
    async function checkHealth() {
      try {
        const r = await fetch('/healthz');
        const dot = document.getElementById('health-dot');
        const label = document.getElementById('health-label');
        if (r.ok) {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400 pulse-dot';
          label.textContent = 'Healthy';
          label.className = 'text-xs text-emerald-500';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-red-400';
          label.textContent = 'Degraded';
          label.className = 'text-xs text-red-400';
        }
      } catch {
        document.getElementById('health-dot').className = 'w-2 h-2 rounded-full bg-red-500';
        document.getElementById('health-label').textContent = 'Unreachable';
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Load machines
    // ─────────────────────────────────────────────────────────────────────────
    async function loadMachines() {
      try {
        const r = await fetch('/api/v1/machines', { headers: headers() });
        if (r.status === 401 || r.status === 403) { toast('Invalid or missing admin token', 'error'); return; }
        if (!r.ok) { toast(`API error: ${r.status}`, 'error'); return; }
        machines = await r.json();
        renderStats();
        renderTable();
      } catch (e) {
        toast('Failed to reach the API', 'error');
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Stats
    // ─────────────────────────────────────────────────────────────────────────
    function renderStats() {
      const counts = { total: machines.length };
      for (const s of Object.keys(STATUS_CFG)) counts[s] = 0;
      for (const m of machines) counts[m.status] = (counts[m.status] || 0) + 1;

      const cards = [
        { key: 'total',           label: 'Total',      icon: 'M8.25 6.75h7.5M8.25 12h7.5m-7.5 5.25h7.5M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z', color: 'text-slate-300', bg: 'bg-white/5' },
        { key: 'pending_approval',label: 'Pending',    icon: 'M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z',             color: 'text-amber-400',   bg: 'bg-amber-500/10' },
        { key: 'registered',      label: 'Registered', icon: 'M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V19.5a2.25 2.25 0 002.25 2.25H15', color: 'text-blue-400',    bg: 'bg-blue-500/10' },
        { key: 'attested',        label: 'Attested',   icon: 'M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z', color: 'text-emerald-400', bg: 'bg-emerald-500/10' },
        { key: 'locked',          label: 'Locked',     icon: 'M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z', color: 'text-orange-400',  bg: 'bg-orange-500/10' },
        { key: 'revoked',         label: 'Revoked',    icon: 'M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636', color: 'text-red-400',     bg: 'bg-red-500/10' },
      ];

      document.getElementById('stats-row').innerHTML = cards.map(c => `
        <div class="glass rounded-xl p-4 flex items-center gap-3 fade-in cursor-pointer ${c.bg}" onclick="setFilter('${c.key === 'total' ? 'all' : c.key}')">
          <div class="p-2 rounded-lg ${c.bg}">
            <svg class="w-5 h-5 ${c.color}" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="${c.icon}"/>
            </svg>
          </div>
          <div>
            <div class="text-xl font-bold text-white">${counts[c.key] ?? 0}</div>
            <div class="text-xs text-slate-500">${c.label}</div>
          </div>
        </div>
      `).join('');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Filter
    // ─────────────────────────────────────────────────────────────────────────
    function setFilter(f) {
      activeFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.style.outline = b.dataset.filter === f ? '2px solid rgba(56,189,248,0.5)' : '';
      });
      renderTable();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Render table
    // ─────────────────────────────────────────────────────────────────────────
    function renderTable() {
      const search = document.getElementById('filter-search').value.toLowerCase();
      let filtered = machines;

      if (activeFilter !== 'all') filtered = filtered.filter(m => m.status === activeFilter);
      if (search) filtered = filtered.filter(m =>
        (m.machine_id||'').toLowerCase().includes(search) ||
        (m.hw_serial||'').toLowerCase().includes(search) ||
        (m.hw_mac||'').toLowerCase().includes(search) ||
        (m.hostname||'').toLowerCase().includes(search) ||
        (m.hw_product||'').toLowerCase().includes(search)
      );

      document.getElementById('machine-count').textContent = `${filtered.length} machine${filtered.length !== 1 ? 's' : ''}`;

      if (!filtered.length) {
        document.getElementById('machine-tbody').innerHTML = `
          <tr><td colspan="8" class="px-4 py-16 text-center text-slate-600 text-xs">No machines match the current filter</td></tr>`;
        return;
      }

      document.getElementById('machine-tbody').innerHTML = filtered.map(m => {
        const actions = buildActions(m);
        return `
          <tr class="border-b border-white/5 glass-hover cursor-pointer fade-in" onclick="openDetail('${m.machine_id}')">
            <td class="px-4 py-3">
              <div class="font-mono text-sky-300 text-[0.68rem]">${trunc(m.machine_id, 16)}</div>
              <div class="text-slate-500 text-[0.65rem] mt-0.5">${m.hostname || '—'}</div>
            </td>
            <td class="px-4 py-3">
              <div class="text-slate-300">${m.hw_product || '—'}</div>
              <div class="text-slate-500 font-mono text-[0.65rem]">${m.hw_serial || '—'} · ${m.hw_mac || '—'}</div>
            </td>
            <td class="px-4 py-3">${roleBadge(m.role)}</td>
            <td class="px-4 py-3">${statusBadge(m.status)}</td>
            <td class="px-4 py-3">
              <span class="font-mono text-slate-500 text-[0.65rem]" title="${m.ek_fingerprint}">${trunc(m.ek_fingerprint, 20)}</span>
            </td>
            <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${fmt(m.registered_at)}</td>
            <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${fmt(m.attested_at)}</td>
            <td class="px-4 py-3 text-right" onclick="event.stopPropagation()">
              <div class="flex justify-end gap-1.5 flex-wrap">${actions}</div>
            </td>
          </tr>`;
      }).join('');
    }

    function buildActions(m) {
      const btns = [];
      if (m.status === 'pending_approval' || m.status === 'registered') {
        btns.push(`<button class="action-btn bg-emerald-500/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/30" onclick="approveM('${m.machine_id}')">Approve</button>`);
      }
      if (m.status === 'attested' || m.status === 'registered') {
        btns.push(`<button class="action-btn bg-orange-500/20 text-orange-400 border-orange-500/30 hover:bg-orange-500/30" onclick="lockM('${m.machine_id}')">Lock</button>`);
      }
      if (m.status === 'locked') {
        btns.push(`<button class="action-btn bg-blue-500/20 text-blue-400 border-blue-500/30 hover:bg-blue-500/30" onclick="unlockM('${m.machine_id}')">Unlock</button>`);
      }
      if (m.status !== 'revoked' && m.status !== 'rejected') {
        btns.push(`<button class="action-btn bg-red-500/20 text-red-400 border-red-500/30 hover:bg-red-500/30" onclick="revokeM('${m.machine_id}')">Revoke</button>`);
      }
      return btns.join('');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Detail panel
    // ─────────────────────────────────────────────────────────────────────────
    function openDetail(id) {
      const m = machines.find(x => x.machine_id === id);
      if (!m) return;

      const rows = [
        ['Machine ID',    `<span class="font-mono text-sky-300 text-xs break-all">${m.machine_id}</span>`],
        ['Status',        statusBadge(m.status)],
        ['Role',          roleBadge(m.role)],
        ['Hostname',      m.hostname || '—'],
        ['Assigned IP',   m.assigned_ip || '—'],
        ['HW Product',    m.hw_product || '—'],
        ['HW Serial',     `<span class="font-mono">${m.hw_serial || '—'}</span>`],
        ['MAC Address',   `<span class="font-mono">${m.hw_mac || '—'}</span>`],
        ['HW UUID',       `<span class="font-mono text-[0.65rem] break-all">${m.hw_uuid || '—'}</span>`],
        ['EK Source',     m.ek_source || '—'],
        ['EK Fingerprint',`<span class="font-mono text-[0.65rem] break-all text-slate-400">${m.ek_fingerprint}</span>`],
        ['Registered',    fmt(m.registered_at)],
        ['Attested',      fmt(m.attested_at)],
        ['Locked',        fmt(m.locked_at)],
        ['Revoked',       fmt(m.revoked_at)],
        ['Token consumed',m.token_consumed ? '<span class="text-amber-400">Yes</span>' : '<span class="text-slate-500">No</span>'],
        ['Wipe pending',  m.wipe_pending ? '<span class="text-red-400 font-semibold">YES</span>' : '<span class="text-slate-500">No</span>'],
      ];

      document.getElementById('detail-content').innerHTML = `
        <div class="flex items-start justify-between mb-2">
          <div>
            <div class="text-sm font-semibold text-white mb-1">Machine Detail</div>
            <div class="font-mono text-sky-400 text-xs">${trunc(m.machine_id, 20)}</div>
          </div>
          <button onclick="closeDetail()" class="text-slate-500 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="space-y-2">
          ${rows.map(([k, v]) => `
            <div class="glass-sm rounded-lg px-3 py-2 flex justify-between gap-4">
              <span class="text-xs text-slate-500 shrink-0">${k}</span>
              <span class="text-xs text-slate-300 text-right">${v}</span>
            </div>`).join('')}
        </div>
        <div class="pt-4 border-t border-white/10">
          <div class="text-xs text-slate-500 mb-3">Actions</div>
          <div class="flex flex-wrap gap-2">${buildActions(m)}</div>
        </div>
      `;

      document.getElementById('detail-overlay').classList.remove('hidden');
      document.getElementById('detail-panel').classList.remove('translate-x-full');
    }

    function closeDetail() {
      document.getElementById('detail-overlay').classList.add('hidden');
      document.getElementById('detail-panel').classList.add('translate-x-full');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Actions
    // ─────────────────────────────────────────────────────────────────────────
    async function approveM(id) {
      const role = prompt('Role (controlplane / worker-infra / worker-app):', 'worker-app');
      if (!role) return;
      const r = await fetch(`/api/v1/machines/${id}/approve`, {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ role }),
      });
      if (r.ok) { toast('Machine approved', 'success'); closeDetail(); loadMachines(); }
      else toast(`Approve failed: ${r.status}`, 'error');
    }

    async function lockM(id) {
      if (!confirm(`Lock machine ${id.slice(0,8)}…?`)) return;
      const r = await fetch(`/api/v1/machines/${id}/lock`, {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ reason: 'Manual lock from dashboard' }),
      });
      if (r.ok) { toast('Machine locked', 'success'); closeDetail(); loadMachines(); }
      else toast(`Lock failed: ${r.status}`, 'error');
    }

    async function unlockM(id) {
      const r = await fetch(`/api/v1/machines/${id}/unlock`, {
        method: 'POST', headers: headers(),
        body: JSON.stringify({}),
      });
      if (r.ok) { toast('Machine unlocked', 'success'); closeDetail(); loadMachines(); }
      else toast(`Unlock failed: ${r.status}`, 'error');
    }

    async function revokeM(id) {
      const wipe = confirm(`Revoke machine ${id.slice(0,8)}…?\n\nClick OK to also schedule a TPM wipe, Cancel to revoke only.`);
      const r = await fetch(`/api/v1/machines/${id}/revoke`, {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ wipe_pending: wipe, reason: 'Manual revoke from dashboard' }),
      });
      if (r.ok) { toast(wipe ? 'Machine revoked + wipe scheduled' : 'Machine revoked', 'success'); closeDetail(); loadMachines(); }
      else toast(`Revoke failed: ${r.status}`, 'error');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Auto-refresh
    // ─────────────────────────────────────────────────────────────────────────
    function startAutoRefresh() {
      stopAutoRefresh();
      refreshTimer = setInterval(() => { if (token()) loadMachines(); }, 30000);
    }

    function stopAutoRefresh() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    document.getElementById('auto-refresh').addEventListener('change', e => {
      e.target.checked ? startAutoRefresh() : stopAutoRefresh();
    });

    // ─────────────────────────────────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────────────────────────────────
    checkHealth();
    setInterval(checkHealth, 15000);
    startAutoRefresh();
    setFilter('all');

    // Load on token enter
    document.getElementById('admin-token').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadMachines();
    });
  </script>
</body>
</html>
