title: ITL.ControlPlane.Attestation
description: TPM hardware trust broker for ITL Control Plane Kubernetes nodes
keywords: attestation, TPM, hardware trust, Kubernetes, ITL Control Plane, machine approval, secure boot, node identity, PKI, Pulumi, infrastructure as code, IaC, Pulumi state backend, zero trust, supply chain security, EK certificate, AK certificate, trust anchor, webhooks, secret vault, metrics, machine lifecycle, node provisioning, FastAPI, Python
baseurl: "/ITL.ControlPlane.Attestation"
url: "https://itlusions.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Mermaid diagrams via jekyll-mermaid or passthrough
plugins:
  - jekyll-sitemap

# Force include static files (robots.txt, sitemap.xml)
include:
  - robots.txt
  - sitemap.xml

# Apply default layout to all markdown pages that don't specify one
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Exclude non-doc files
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.py"
  - "*.sh"
  - docker-compose.yml
  - Dockerfile
  - pyproject.toml
  - README.md
