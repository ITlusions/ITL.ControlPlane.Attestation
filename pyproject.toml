[project]
name = "itl-controlplane-attestation"
version = "1.0.0"
description = "ITL Control Plane — Attestation Service: TPM EK-based hardware identity registration and machine lifecycle management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.21",
    "pydantic>=2.9",
    "cryptography>=43",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "pyjwt>=2.10",
    "aiofiles>=24",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation"]
