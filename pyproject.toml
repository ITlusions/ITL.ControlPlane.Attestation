[project]
name = "itl-controlplane-attestation"
version = "1.0.0"
description = "ITL Control Plane — Attestation Service: TPM EK-based hardware identity registration and machine lifecycle management"
requires-python = ">=3.12"
dependencies = [
    "itl-attestation-sdk @ git+https://github.com/ITlusions/ITL.ControlPlane.Attestation.Sdk.git@main",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.19.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.0",
    "cryptography>=43",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "pyjwt>=2.10",
    "aiofiles>=24",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.entry-points."attestation_cli_plugins"]
webhooks = "extensions.builtin.webhooks.cli_plugin:WebhooksCliPlugin"
metrics = "extensions.builtin.metrics.cli_plugin:MetricsCliPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation", "src/extensions"]
