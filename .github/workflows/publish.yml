name: Publish — Release published

# ---------------------------------------------------------------------------
# Publish orchestrator for ITL.ControlPlane.Attestation
#
# Triggered when a GitHub Release is published — which happens automatically
# at the end of each ci-*.yml (create-release job) after a successful CI run.
#
# Tag routing (resolved from the release tag name):
#   sdk/vX.Y.Z     → PyPI     (itl-attestation-sdk,    environment: pypi-sdk)
#   cli/vX.Y.Z     → PyPI     (itl-attestation-cli,    environment: pypi-cli)
#   pulumi/vX.Y.Z  → PyPI     (itl-attestation-pulumi, environment: pypi-pulumi)
#   service/vX.Y.Z → GHCR     (ghcr.io/itlusions/itl-attestation)
#
# Authentication: PyPI Trusted Publisher (OIDC) for Python packages — no API tokens.
# ---------------------------------------------------------------------------
on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:

  # ── Resolve which component this release targets ───────────────────────────
  resolve-target:
    name: Resolve publish target
    runs-on: ubuntu-latest
    outputs:
      component:   ${{ steps.route.outputs.component }}
      environment: ${{ steps.route.outputs.environment }}
      version:     ${{ steps.route.outputs.version }}
    steps:
      - name: Route by tag prefix
        id: route
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == sdk/* ]]; then
            echo "component=sdk"         >> "$GITHUB_OUTPUT"
            echo "environment=pypi-sdk"  >> "$GITHUB_OUTPUT"
            echo "version=${TAG#sdk/v}"  >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == cli/* ]]; then
            echo "component=cli"         >> "$GITHUB_OUTPUT"
            echo "environment=pypi-cli"  >> "$GITHUB_OUTPUT"
            echo "version=${TAG#cli/v}"  >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == pulumi/* ]]; then
            echo "component=pulumi"           >> "$GITHUB_OUTPUT"
            echo "environment=pypi-pulumi"    >> "$GITHUB_OUTPUT"
            echo "version=${TAG#pulumi/v}"    >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == service/* ]]; then
            echo "component=service"          >> "$GITHUB_OUTPUT"
            echo "environment=ghcr"           >> "$GITHUB_OUTPUT"
            echo "version=${TAG#service/v}"   >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised tag prefix: $TAG" && exit 1
          fi

  # ── Publish SDK → PyPI ─────────────────────────────────────────────────────
  publish-sdk:
    name: Publish SDK → PyPI
    needs: resolve-target
    if: needs.resolve-target.outputs.component == 'sdk'
    uses: ITlusions/ITL.Github/.github/workflows/_reusable-publish-pypi.yml@main
    with:
      artifact-name:    "sdk-wheel"
      ci-workflow-name: "CI — SDK"
      commit-sha:       ${{ github.event.release.target_commitish }}
      environment:      "pypi-sdk"

  # ── Publish CLI → PyPI ─────────────────────────────────────────────────────
  publish-cli:
    name: Publish CLI → PyPI
    needs: resolve-target
    if: needs.resolve-target.outputs.component == 'cli'
    uses: ITlusions/ITL.Github/.github/workflows/_reusable-publish-pypi.yml@main
    with:
      artifact-name:    "cli-wheel"
      ci-workflow-name: "CI — CLI"
      commit-sha:       ${{ github.event.release.target_commitish }}
      environment:      "pypi-cli"

  # ── Publish Pulumi Provider → PyPI ─────────────────────────────────────────
  publish-pulumi:
    name: Publish Pulumi Provider → PyPI
    needs: resolve-target
    if: needs.resolve-target.outputs.component == 'pulumi'
    uses: ITlusions/ITL.Github/.github/workflows/_reusable-publish-pypi.yml@main
    with:
      artifact-name:    "pulumi-wheel"
      ci-workflow-name: "CI — Pulumi Provider"
      commit-sha:       ${{ github.event.release.target_commitish }}
      environment:      "pypi-pulumi"

  # ── Push Service image → GHCR ──────────────────────────────────────────────
  publish-service:
    name: Push Service → GHCR
    needs: resolve-target
    if: needs.resolve-target.outputs.component == 'service'
    uses: ITlusions/ITL.Github/.github/workflows/_reusable-docker-build.yml@main
    with:
      image-name: "ghcr.io/itlusions/itl-attestation"
      tag:        ${{ needs.resolve-target.outputs.version }}
      ref:        ${{ github.event.release.tag_name }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}