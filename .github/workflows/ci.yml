name: CI

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# ── Shared permissions ────────────────────────────────────────────────────────
permissions:
  contents: read

jobs:

  # ── 1. Read versions from all pyproject.toml files ──────────────────────────
  detect-version:
    name: Detect versions
    runs-on: ubuntu-latest
    outputs:
      sdk_version:     ${{ steps.ver.outputs.sdk_version }}
      cli_version:     ${{ steps.ver.outputs.cli_version }}
      service_version: ${{ steps.ver.outputs.service_version }}
      is_release:      ${{ steps.ver.outputs.is_release }}
      tag_prefix:      ${{ steps.ver.outputs.tag_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: ver
        run: |
          SDK_VERSION=$(python3 -c "
          import tomllib
          print(tomllib.load(open('src/sdk/pyproject.toml','rb'))['project']['version'])
          ")
          CLI_VERSION=$(python3 -c "
          import tomllib
          print(tomllib.load(open('src/cli/pyproject.toml','rb'))['project']['version'])
          ")
          SERVICE_VERSION=$(python3 -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")

          IS_RELEASE=false
          TAG_PREFIX=""
          if [[ "$GITHUB_REF_NAME" == release/sdk-* ]]; then
            IS_RELEASE=true; TAG_PREFIX="sdk"
          elif [[ "$GITHUB_REF_NAME" == release/cli-* ]]; then
            IS_RELEASE=true; TAG_PREFIX="cli"
          elif [[ "$GITHUB_REF_NAME" == release/service-* ]]; then
            IS_RELEASE=true; TAG_PREFIX="service"
          fi

          echo "sdk_version=$SDK_VERSION"         >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION"         >> "$GITHUB_OUTPUT"
          echo "service_version=$SERVICE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE"           >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX"           >> "$GITHUB_OUTPUT"

  # ── 2a. Lint — SDK ────────────────────────────────────────────────────────
  lint-sdk:
    name: Lint SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e "src/sdk[dev]"
      - name: ruff check
        run: ruff check src/sdk/
      - name: mypy
        run: mypy src/sdk/ --ignore-missing-imports

  # ── 2b. Lint — CLI ────────────────────────────────────────────────────────
  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e "src/sdk" -e "src/cli[dev]"
      - name: ruff check
        run: ruff check src/cli/

  # ── 3. Test — Attestation service (all shared tests) ─────────────────────
  test-attestation:
    name: Test Attestation (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── 4a. Build — SDK wheel ────────────────────────────────────────────────
  build-sdk-wheel:
    name: Build SDK wheel
    runs-on: ubuntu-latest
    needs: [detect-version, lint-sdk, test-attestation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          cd src/sdk && python -m build
      - name: Verify wheel
        run: pip install twine && twine check src/sdk/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-wheel
          path: src/sdk/dist/
          retention-days: 7

  # ── 4b. Build — CLI wheel ────────────────────────────────────────────────
  build-cli-wheel:
    name: Build CLI wheel
    runs-on: ubuntu-latest
    needs: [detect-version, lint-cli, test-attestation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          cd src/cli && python -m build
      - name: Verify wheel
        run: pip install twine && twine check src/cli/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: cli-wheel
          path: src/cli/dist/
          retention-days: 7

  # ── 5. Build — Docker image (smoke only, no push) ────────────────────────
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test-attestation]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/itlusions/itl-attestation:ci .

  # ── 6. Auto-tag ──────────────────────────────────────────────────────────
  #
  #  release/** branch  →  creates RC tag  (e.g. sdk/v0.2.0-rc.5)
  #  main               →  creates final tag + draft GitHub Release
  #                         (user publishes draft → triggers publish.yml)
  # ─────────────────────────────────────────────────────────────────────────
  auto-tag:
    name: Auto-tag
    runs-on: ubuntu-latest
    needs: [detect-version, build-sdk-wheel, build-cli-wheel, build-docker]
    if: |
      github.ref_name == 'main' ||
      needs.detect-version.outputs.is_release == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── RC tag on release/** branches ──────────────────────────────────
      - name: Create RC tag
        if: needs.detect-version.outputs.is_release == 'true'
        env:
          PREFIX:          ${{ needs.detect-version.outputs.tag_prefix }}
          SDK_VERSION:     ${{ needs.detect-version.outputs.sdk_version }}
          CLI_VERSION:     ${{ needs.detect-version.outputs.cli_version }}
          SERVICE_VERSION: ${{ needs.detect-version.outputs.service_version }}
        run: |
          case "$PREFIX" in
            sdk)     VERSION="$SDK_VERSION"     ;;
            cli)     VERSION="$CLI_VERSION"     ;;
            service) VERSION="$SERVICE_VERSION" ;;
          esac
          TAG="${PREFIX}/v${VERSION}-rc.${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created RC tag: $TAG"

      # ── Final tags + draft releases on main ────────────────────────────
      - name: Create final tags and draft releases
        if: github.ref_name == 'main'
        env:
          SDK_VERSION:     ${{ needs.detect-version.outputs.sdk_version }}
          CLI_VERSION:     ${{ needs.detect-version.outputs.cli_version }}
          SERVICE_VERSION: ${{ needs.detect-version.outputs.service_version }}
        run: |
          for ENTRY in "sdk:$SDK_VERSION" "cli:$CLI_VERSION" "service:$SERVICE_VERSION"; do
            PREFIX="${ENTRY%%:*}"
            VERSION="${ENTRY##*:}"
            TAG="${PREFIX}/v${VERSION}"

            if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
              echo "Tag $TAG already exists — skipping"
            else
              git tag "$TAG"
              git push origin "$TAG"
              gh release create "$TAG" \
                --title "${PREFIX} v${VERSION}" \
                --generate-notes \
                --draft
              echo "Created draft release for $TAG"
            fi
          done
